tags:
  - Contacts
summary: Create  contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - _id
          - userId
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact's name
            example: Olena
          phoneNumber:
            type: string
            description: Contact phone number
            example: '+380123456789'
          email:
            type: string
            format: email
            description: Contact email
            example: olenapav13@gmail.com
          isFavourite:
            type: boolean
            description: Whether the contact is favourite
            default: false
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: home
          photo:
            type: string
            format: binary
            description: Contact's photo (file)
responses:
  '201':
    description: Contact successfully created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: ../../components/responses/contacts/400.yaml
  '401':
    $ref: ../../components/responses/contacts/401.yaml
