tags:
  - Contacts
summary: Patch contact by ID
operationId: patchContact
description: Updates contact fields by ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: ID of the contact to be patched
requestBody:
  required: true
  description: Fields to update
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact's name
            example: Olena
          phoneNumber:
            type: string
            description: Contact phone number
            example: '+380123456789'
          email:
            type: string
            format: email
            description: Contact email
            example: olenapav13@gmail.com
          isFavourite:
            type: boolean
            description: Whether the contact is favourite
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: home
          photo:
            type: string
            format: binary
            description: Contact's photo (file)
responses:
  '200':
    description: Patched a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/contacts/400.yaml
  '401':
    $ref: ../../../components/responses/contacts/401.yaml
  '404':
    $ref: ../../../components/responses/contacts/404.yaml
