tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Updates a contact's data by ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../components/schemas/contact.yaml
responses:
  '200':
    description: Patched a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '404':
    $ref: ../../../components/responses/contacts/404.yaml
  '401':
    $ref: ../../../components/responses/contacts/401.yaml
  '400':
    $ref: ../../../components/responses/contacts/400.yaml
